<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Secret Vote</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
    }
    main {
      width: min(90vw, 420px);
      background: #1f2937;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin-top: 0;
      font-size: 1.3rem;
    }
    p {
      margin: 0.5rem 0 1rem;
    }
    form {
      display: grid;
      gap: 0.75rem;
    }
    input, button {
      font: inherit;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #4b5563;
    }
    input {
      background: #111827;
      color: #f9fafb;
    }
    button {
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    ul {
      padding-left: 1.2rem;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Anonymous Secret Vote</h1>
    <p id="status">Person 1 of 5: enter your vote, then pass to the next person.</p>
    <form id="vote-form">
      <input id="vote-input" type="text" placeholder="Name you choose" autocomplete="off" required>
      <button type="submit">Submit Vote</button>
    </form>
    <section id="results" hidden>
      <h2>Shuffled Answers</h2>
      <ul id="answers"></ul>
    </section>
  </main>

  <script>
    const totalVoters = 5;
    const votes = [];
    const status = document.getElementById('status');
    const form = document.getElementById('vote-form');
    const input = document.getElementById('vote-input');
    const results = document.getElementById('results');
    const answers = document.getElementById('answers');

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim();

      if (!value) {
        return;
      }

      votes.push(value);
      input.value = '';

      if (votes.length < totalVoters) {
        status.textContent = `Person ${votes.length + 1} of ${totalVoters}: enter your vote, then pass to the next person.`;
        input.focus();
        return;
      }

      form.hidden = true;
      status.textContent = 'All votes received.';
      const shuffledVotes = shuffle([...votes]);

      shuffledVotes.forEach((vote) => {
        const item = document.createElement('li');
        item.textContent = vote;
        answers.appendChild(item);
      });

      results.hidden = false;
    });
  </script>
</body>
</html>
